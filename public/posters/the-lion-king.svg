<rect width="600" height="900" fill="url(#bg)"/>
<g><circle cx="300" cy="260" r="170" fill="#ffd166"/><path d="M0 560 Q150 520 300 550 T600 540 V640 H0Z" fill="#7a1f0c"/><path d="M300 560 V400 M300 440 L360 380 M300 470 L240 400" stroke="#7a1f0c" stroke-width="10" fill="none"/><ellipse cx="300" cy="370" rx="150" ry="32" fill="#7a1f0c"/><ellipse cx="380" cy="400" rx="90" ry="22" fill="#7a1f0c"/></g>
