<text x="40" y="808" font-family="Georgia, 'Times New Roman', serif" font-size="75" font-weight="700" fill="#fff">The Lion King</text>
<text x="40" y="858" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#fff" opacity=".8">1994, directed by Roger Allers</text>
<rect x="12" y="12" width="576" height="876" rx="6" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
